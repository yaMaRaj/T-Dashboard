[project]
name = "mcp-playwright"
version = "0.1.0"
description = "MCP server for T-Dashboard Playwright test execution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0,<2",
  "httpx>=0.27.0",
]

[project.scripts]
mcp-playwright = "mcp_playwright.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_playwright*"]
